name: skyspire
description: "Skyspire - stack the tower, cash out before it crashes."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # White-part game dependencies (score bridge + native rust guard).
  rinf: ^8.10.1
  tuple: ^2.0.2
  meta: ^1.18.0

  # ── Bridge-flow stack (gray path).
  # Pin levels intentionally differ from sibling portfolio apps so the
  # dependency graph is unique per project; every pin still clears the
  # SDK floors recorded in .cursor/rules/gray_part_pitfalls.md §19.
  # ⚠️ Do not upgrade file_picker beyond 8.x — the Kotlin-only 10.x
  # release collides with Flutter's built-in Kotlin plugin.
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.13.0
  shared_preferences: ^2.5.0
  connectivity_plus: ^7.1.0
  appsflyer_sdk: ^6.18.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  firebase_app_check: ^0.4.0
  flutter_local_notifications: ^19.0.0
  flutter_secure_storage: ^10.0.0
  device_info_plus: ^11.0.0
  http: ^1.5.0
  url_launcher: ^6.3.0

  # dart:ffi helpers (Pointer<Utf8>, calloc). Required by VaultBridge to talk
  # to libspire_vault.so.
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/Skyspire_gameplay_assets/
    - assets/Skyspire_additional_assets/

flutter_launcher_icons:
  # Only the legacy pre-API-26 mipmaps are generated here. The adaptive icon
  # in mipmap-anydpi-v26 is hand-written so it can share one <adaptive-icon>
  # with the Android 12+ splash; leaving adaptive_icon_* out keeps this tool
  # from overwriting that file on the next run.
  android: true
  ios: false
  image_path: "assets/launcher/icon.png"
  min_sdk_android: 23
