org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false

# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Pitfalls §8 — kotlin.incremental=true collides with the Rinf FFI codegen
# that this project runs post-build (rinf regenerates the signals bindings
# whenever the Rust side changes). Disable it so the Kotlin compiler always
# starts from a clean cache.
kotlin.incremental=false

# Pitfalls §9 — opt into the 16 KB page-size layout for AGP 8.5+.
android.experimental.enableNewResourceShrinker.preciseShrinking=true
