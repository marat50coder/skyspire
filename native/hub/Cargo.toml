[package]
name = "hub"
version = "0.1.0"
edition = "2021"

[lib]
# `lib` for tests/benches; `cdylib` for Android/Windows; `staticlib` for iOS.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
rinf = "8.10.1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.45", features = ["rt", "macros", "sync"] }
